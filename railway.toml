# Railway config for the Xarji landing page. Nixpacks auto-detects Bun from
# the presence of bun.lock, then runs `build` and `start` scripts from
# package.json. See server.ts for the Bun static server.

[build]
builder = "NIXPACKS"
buildCommand = "bun install && bun run build"

[deploy]
startCommand = "bun run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/"
